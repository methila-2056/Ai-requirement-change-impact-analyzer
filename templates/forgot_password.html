{% extends "base.html" %}
{% block title %}Forgot Password — Strategic Impact Analyzer{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="icon-key"></i>
      </div>
      <h2>Forgot password?</h2>
      <p class="auth-sub">Enter your email to generate a reset link</p>
    </div>

    <form method="POST" action="{{ url_for('forgot_password') }}" class="auth-form">
      <div class="form-group">
        <label class="form-label" for="email">
          <i class="icon-mail"></i> Email
        </label>
        <input class="form-input" type="email" id="email" name="email"
               placeholder="you@example.com" required autofocus autocomplete="email">
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">
        <i class="icon-send"></i> Generate Reset Link
      </button>
    </form>

    <div class="auth-divider">
      <span>Remember your password?</span>
    </div>

    <a href="{{ url_for('login') }}" class="btn btn-outline btn-block">
      <i class="icon-log-in"></i> Back to Sign In
    </a>
  </div>
</div>
{% endblock %}
