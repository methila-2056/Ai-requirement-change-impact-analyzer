{% extends "base.html" %}
{% block title %}Reset Password — Strategic Impact Analyzer{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="icon-lock"></i>
      </div>
      <h2>Set new password</h2>
      <p class="auth-sub">Choose a strong password for your account</p>
    </div>

    <form method="POST" action="{{ url_for('reset_password', token=token) }}" class="auth-form">
      <div class="form-group">
        <label class="form-label" for="password">
          <i class="icon-key"></i> New Password
        </label>
        <div class="input-with-icon">
          <input class="form-input" type="password" id="password" name="password"
                 placeholder="At least 6 characters" required minlength="6" autocomplete="new-password"
                 oninput="checkPasswordStrength(this.value)">
          <button type="button" class="input-icon-btn" onclick="togglePassword(this)" aria-label="Toggle password visibility">
            <i class="icon-eye"></i>
          </button>
        </div>
        <div class="password-strength" id="passwordStrength">
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <span class="strength-text" id="strengthText"></span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">
          <i class="icon-lock"></i> Confirm Password
        </label>
        <input class="form-input" type="password" id="confirm_password" name="confirm_password"
               placeholder="Repeat your password" required autocomplete="new-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">
        <i class="icon-check-circle"></i> Reset Password
      </button>
    </form>

    <div class="auth-divider">
      <span>Remember your password?</span>
    </div>

    <a href="{{ url_for('login') }}" class="btn btn-outline btn-block">
      <i class="icon-log-in"></i> Back to Sign In
    </a>
  </div>
</div>
{% endblock %}
