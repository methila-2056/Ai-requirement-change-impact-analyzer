<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI-Powered Change Impact Analysis for Software Requirements — Analyze XML configurations, map dependencies, calculate risk scores.">
  <title>Profile Settings — Strategic Impact Analyzer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9889;</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/lucide-static@latest/font/lucide.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar" id="navbar">
    <div class="navbar-inner">
      <a href="/" class="nav-brand">
        <div class="nav-brand-icon"><i class="icon-zap"></i></div>
        <div class="nav-brand-text">
          <span class="nav-brand-name">SIA</span>
          <span class="nav-brand-tag">v2.0</span>
        </div>
      </a>
      <div class="nav-links" id="navLinks"></div>
      <button class="nav-hamburger" id="navHamburger" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-card" style="max-width: 480px;">
      <div class="auth-header">
        <div class="auth-logo">
          <i class="icon-settings"></i>
        </div>
        <h2>Profile Settings</h2>
        <p class="auth-sub">Manage your account information</p>
      </div>

      <div id="profileSuccess" class="flash flash-success" style="display:none; margin-bottom:16px;">
        <i class="icon-check-circle"></i>
        <span id="profileSuccessText"></span>
        <button class="flash-close" onclick="this.parentElement.style.display='none'">&times;</button>
      </div>

      <div id="profileError" class="flash flash-error" style="display:none; margin-bottom:16px;">
        <i class="icon-alert-circle"></i>
        <span id="profileErrorText"></span>
        <button class="flash-close" onclick="this.parentElement.style.display='none'">&times;</button>
      </div>

      <form class="auth-form" id="profileForm">
        <div class="form-group">
          <label class="form-label" for="full_name">
            <i class="icon-user"></i> Full Name
          </label>
          <input class="form-input" type="text" id="full_name" name="full_name" placeholder="Your full name">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">
            <i class="icon-mail"></i> Email
          </label>
          <input class="form-input" type="email" id="email" name="email" required>
        </div>

        <div class="divider" style="margin: 24px 0;"></div>

        <div class="form-group">
          <label class="form-label" for="current_password">
            <i class="icon-lock"></i> Current Password
          </label>
          <input class="form-input" type="password" id="current_password" name="current_password" placeholder="Required to change password">
        </div>

        <div class="form-group">
          <label class="form-label" for="new_password">
            <i class="icon-key"></i> New Password
          </label>
          <div class="input-with-icon">
            <input class="form-input" type="password" id="new_password" name="new_password" placeholder="Leave blank to keep current"
                   oninput="checkPasswordStrength(this.value)">
            <button type="button" class="input-icon-btn" onclick="togglePassword(this)" aria-label="Toggle password visibility">
              <i class="icon-eye"></i>
            </button>
          </div>
          <div class="password-strength" id="passwordStrength">
            <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
            <span class="strength-text" id="strengthText"></span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <i class="icon-save"></i> Save Changes
        </button>
      </form>

      <div class="auth-divider">
        <span>Account Info</span>
      </div>

      <div class="profile-info">
        <div class="profile-info-row">
          <span class="profile-info-label">Username</span>
          <span class="profile-info-value" id="profileUsername">-</span>
        </div>
        <div class="profile-info-row">
          <span class="profile-info-label">Member Since</span>
          <span class="profile-info-value" id="profileMemberSince">-</span>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <div class="nav-brand-icon" style="width:28px;height:28px;font-size:14px;">
          <i class="icon-zap"></i>
        </div>
        <span>SIA</span>
      </div>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="https://github.com/methila-2056/Ai-requirement-change-impact-analyzer" target="_blank" rel="noopener">Source Code</a>
        <a href="register.html">Get Started</a>
      </div>
      <div class="footer-copy">
        &copy; 2026 Strategic Impact Analyzer. Built with precision.
      </div>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    (function() {
      var token = localStorage.getItem('sia_token');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }

      fetch(getApiBase() + '/api/profile', {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(function(res) { return res.json(); }).then(function(data) {
        if (data.error) {
          if (data.error === 'Unauthorized') {
            localStorage.removeItem('sia_token');
            localStorage.removeItem('sia_user');
            window.location.href = 'login.html';
          }
          return;
        }
        var user = data;
        document.getElementById('full_name').value = user.full_name || '';
        document.getElementById('email').value = user.email || '';
        document.getElementById('profileUsername').textContent = user.username;
        document.getElementById('profileMemberSince').textContent = user.created_at ? new Date(user.created_at).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : '-';
      });

      document.getElementById('profileForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var errBox = document.getElementById('profileError');
        var errText = document.getElementById('profileErrorText');
        var successBox = document.getElementById('profileSuccess');
        var successText = document.getElementById('profileSuccessText');
        errBox.style.display = 'none';
        successBox.style.display = 'none';

        var fullName = document.getElementById('full_name').value.trim();
        var email = document.getElementById('email').value.trim();
        var currentPassword = document.getElementById('current_password').value;
        var newPassword = document.getElementById('new_password').value;

        try {
          var body = { full_name: fullName, email: email };
          if (currentPassword && newPassword) {
            body.current_password = currentPassword;
            body.new_password = newPassword;
          }
          var res = await fetch(getApiBase() + '/api/profile', {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify(body)
          });
          var data = await res.json();
          if (data.error) {
            errText.textContent = data.error;
            errBox.style.display = 'flex';
            return;
          }
          successText.textContent = 'Profile updated successfully.';
          successBox.style.display = 'flex';
          document.getElementById('current_password').value = '';
          document.getElementById('new_password').value = '';

          var updatedUser = data.user || data;
          if (updatedUser && updatedUser.username) {
            localStorage.setItem('sia_user', JSON.stringify(updatedUser));
          }
        } catch (err) {
          errText.textContent = 'Network error. Make sure the server is running.';
          errBox.style.display = 'flex';
        }
      });
    })();
  </script>
</body>
</html>
