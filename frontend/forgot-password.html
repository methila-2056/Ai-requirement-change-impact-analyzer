<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI-Powered Change Impact Analysis for Software Requirements — Analyze XML configurations, map dependencies, calculate risk scores.">
  <title>Forgot Password — Strategic Impact Analyzer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9889;</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/lucide-static@latest/font/lucide.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar" id="navbar">
    <div class="navbar-inner">
      <a href="/" class="nav-brand">
        <div class="nav-brand-icon"><i class="icon-zap"></i></div>
        <div class="nav-brand-text">
          <span class="nav-brand-name">SIA</span>
          <span class="nav-brand-tag">v2.0</span>
        </div>
      </a>
      <div class="nav-links" id="navLinks"></div>
      <button class="nav-hamburger" id="navHamburger" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <i class="icon-key"></i>
        </div>
        <h2>Forgot password?</h2>
        <p class="auth-sub">Enter your email to generate a reset link</p>
      </div>

      <div id="forgotError" class="flash flash-error" style="display:none; margin-bottom:16px;">
        <i class="icon-alert-circle"></i>
        <span id="forgotErrorText"></span>
        <button class="flash-close" onclick="this.parentElement.style.display='none'">&times;</button>
      </div>

      <div id="forgotSuccess" class="flash flash-success" style="display:none; margin-bottom:16px;">
        <i class="icon-check-circle"></i>
        <span id="forgotSuccessText"></span>
        <button class="flash-close" onclick="this.parentElement.style.display='none'">&times;</button>
      </div>

      <form class="auth-form" id="forgotForm">
        <div class="form-group">
          <label class="form-label" for="email">
            <i class="icon-mail"></i> Email
          </label>
          <input class="form-input" type="email" id="email" name="email"
                 placeholder="you@example.com" required autofocus autocomplete="email">
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <i class="icon-send"></i> Generate Reset Link
        </button>
      </form>

      <div class="auth-divider">
        <span>Remember your password?</span>
      </div>

      <a href="login.html" class="btn btn-outline btn-block">
        <i class="icon-log-in"></i> Back to Sign In
      </a>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <div class="nav-brand-icon" style="width:28px;height:28px;font-size:14px;">
          <i class="icon-zap"></i>
        </div>
        <span>SIA</span>
      </div>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="https://github.com/methila-2056/Ai-requirement-change-impact-analyzer" target="_blank" rel="noopener">Source Code</a>
        <a href="register.html">Get Started</a>
      </div>
      <div class="footer-copy">
        &copy; 2026 Strategic Impact Analyzer. Built with precision.
      </div>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    (function() {
      document.getElementById('forgotForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var errBox = document.getElementById('forgotError');
        var errText = document.getElementById('forgotErrorText');
        var successBox = document.getElementById('forgotSuccess');
        var successText = document.getElementById('forgotSuccessText');
        errBox.style.display = 'none';
        successBox.style.display = 'none';

        var email = document.getElementById('email').value.trim();

        try {
          var res = await fetch(getApiBase() + '/api/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
          });
          var data = await res.json();
          if (data.error) {
            errText.textContent = data.error;
            errBox.style.display = 'flex';
            return;
          }
          successText.textContent = data.message || 'If an account exists with that email, a reset link has been sent.';
          successBox.style.display = 'flex';
        } catch (err) {
          errText.textContent = 'Network error. Make sure the server is running.';
          errBox.style.display = 'flex';
        }
      });
    })();
  </script>
</body>
</html>
